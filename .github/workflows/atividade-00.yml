name: Atividade 0 - ambiente e primeiro PR

# pull_request_target roda o workflow da branch base (main), nao o da branch do
# aluno: assim ninguem "corrige a propria prova" editando este arquivo no fork.
# Em troca, este job NUNCA faz checkout nem executa codigo vindo do PR --- ele
# apenas le o conteudo dos arquivos alterados como texto, via API.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: atividade-00-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Verificacao automatica
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr    = context.payload.pull_request;
            const login = pr.user.login;
            const owner = context.repo.owner;
            const repo  = context.repo.repo;

            // ---------------------------------------------------------------
            // Utilidades
            // ---------------------------------------------------------------
            // Compara sem acento e sem caixa: "Frequência" casa com "frequencia"
            const norm = s => (s || '')
              .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
              .toLowerCase();

            const arquivoAluno = `alunos/${login}.md`;

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: pr.number, per_page: 100,
            });
            const nomes = files.map(f => f.filename);
            const acha  = alvo => files.find(
              f => f.filename.toLowerCase() === alvo.toLowerCase()
            );

            async function conteudo(file) {
              if (!file || !file.raw_url) return null;
              try {
                const r = await fetch(file.raw_url);
                return r.ok ? await r.text() : null;
              } catch (e) {
                return null;
              }
            }

            const obrigatorios = [];
            const avisos       = [];
            const ok   = (nome, detalhe) =>
              obrigatorios.push({ passou: true,  nome, detalhe });
            const erro = (nome, detalhe) =>
              obrigatorios.push({ passou: false, nome, detalhe });

            // ---------------------------------------------------------------
            // 1. Fluxo Git: branch propria
            // ---------------------------------------------------------------
            if (pr.head.ref === 'atividade-00') {
              ok('Branch `atividade-00`', 'a entrega esta na branch certa');
            } else if (pr.head.ref === 'main' || pr.head.ref === 'master') {
              erro('Branch `atividade-00`',
                   `voce commitou direto na \`${pr.head.ref}\`. Crie a branch com ` +
                   '`git switch -c atividade-00`, mova os commits para ela e abra ' +
                   'um novo PR. Commit direto na main zera a atividade.');
            } else {
              erro('Branch `atividade-00`',
                   `a branch deste PR e \`${pr.head.ref}\`; o esperado e \`atividade-00\``);
            }

            // ---------------------------------------------------------------
            // 2. Titulo do PR
            // ---------------------------------------------------------------
            if (/^atividade\s*0\s*[-–—]{1,2}\s*\S+/i.test(norm(pr.title))) {
              ok('Titulo do PR', 'segue o padrao `Atividade 0 -- Seu Nome`');
            } else {
              erro('Titulo do PR',
                   `o titulo e "${pr.title}"; o padrao e \`Atividade 0 -- Seu Nome\``);
            }

            // ---------------------------------------------------------------
            // 3. Arquivos entregues
            // ---------------------------------------------------------------
            const fAluno    = acha(arquivoAluno);
            const fAmbiente = acha('ambiente.txt');

            if (fAluno) {
              ok('`' + arquivoAluno + '`', 'arquivo de apresentacao encontrado');
            } else {
              const parecido = nomes.find(n => n.toLowerCase().startsWith('alunos/'));
              erro('`' + arquivoAluno + '`',
                   parecido
                     ? `encontrei \`${parecido}\`, mas o nome do arquivo precisa ser ` +
                       `exatamente o seu usuario do GitHub: \`${arquivoAluno}\``
                     : 'arquivo nao encontrado no PR');
            }

            if (fAmbiente) {
              ok('`ambiente.txt`', 'relatorio do ambiente encontrado');
            } else {
              erro('`ambiente.txt`',
                   'gere com `./scripts/check-ambiente.sh | tee ambiente.txt` e ' +
                   'commite o arquivo');
            }

            const permitidos = [arquivoAluno.toLowerCase(), 'ambiente.txt'];
            const extras = nomes.filter(n => !permitidos.includes(n.toLowerCase()));
            if (extras.length) {
              avisos.push(
                'Este PR altera arquivos que nao fazem parte da Atividade 0: ' +
                extras.map(n => '`' + n + '`').join(', ') +
                '. Confira se foi intencional --- em especial, `alunos/_modelo.md` ' +
                'nao deve ser alterado.'
              );
            }

            // ---------------------------------------------------------------
            // 4. Conteudo do ambiente.txt
            // ---------------------------------------------------------------
            const txtAmbiente = await conteudo(fAmbiente);
            if (txtAmbiente !== null) {
              const faltas = (txtAmbiente.match(/\[FALTA\]/g)  || []).length;
              const velhos = (txtAmbiente.match(/\[antigo\]/g) || []).length;
              const pronto = /ambiente pronto/i.test(norm(txtAmbiente));

              if (faltas === 0 && velhos === 0 && pronto) {
                ok('Ambiente verificado',
                   'nenhum `[FALTA]` ou `[antigo]`, e o script terminou com ' +
                   '"Ambiente pronto"');
              } else if (!pronto && faltas === 0 && velhos === 0) {
                erro('Ambiente verificado',
                     'nao encontrei a linha "Ambiente pronto" no `ambiente.txt`. ' +
                     'Cole a saida completa do script, do cabecalho ao veredito.');
              } else {
                erro('Ambiente verificado',
                     `o relatorio tem ${faltas} item(ns) \`[FALTA]\` e ${velhos} ` +
                     '`[antigo]`. Resolva o que o proprio script indicou, rode-o ' +
                     'de novo e atualize o `ambiente.txt`.');
              }
            } else if (fAmbiente) {
              avisos.push('Nao consegui ler o conteudo do `ambiente.txt`.');
            }

            // ---------------------------------------------------------------
            // 5. Conteudo do arquivo de apresentacao
            // ---------------------------------------------------------------
            const txtAluno = await conteudo(fAluno);
            if (txtAluno !== null) {
              const n = norm(txtAluno);

              // 5a. Placeholders do modelo
              const sobraram = (txtAluno.match(/<[^>\n]{2,60}>/g) || [])
                .filter(m => !/^<!--/.test(m) && !/@/.test(m));
              if (sobraram.length === 0) {
                ok('Modelo preenchido', 'nenhum campo `<...>` deixado por preencher');
              } else {
                erro('Modelo preenchido',
                     'ainda ha campos do modelo por preencher: ' +
                     [...new Set(sobraram)].slice(0, 6)
                       .map(s => '`' + s + '`').join(', '));
              }

              // 5b. Parte A
              const campos = [
                ['github',            /github/],
                ['curso e periodo',   /curso e periodo/],
                ['linguagem',         /linguagem que voce domina/],
                ['experiencia Linux', /ja usou linux/],
                ['experiencia Docker',/ja usou docker/],
                ['expectativa',       /o que voce espera/],
              ];
              const faltandoA = campos.filter(([, re]) => !re.test(n)).map(([k]) => k);
              if (faltandoA.length === 0) {
                ok('Parte A - apresentacao', 'todos os campos presentes');
              } else {
                erro('Parte A - apresentacao',
                     'faltam os campos: ' + faltandoA.join(', '));
              }

              // 5c. Parte B - as quatro metricas DORA
              const metricas = [
                ['frequencia de implantacao', /frequencia de implantacao/],
                ['lead time',                 /lead ?time/],
                ['tempo de restauracao',      /tempo de restauracao/],
                ['taxa de falha',             /taxa de falha/],
              ];
              const faltandoB = metricas.filter(([, re]) => !re.test(n)).map(([k]) => k);
              if (faltandoB.length === 0) {
                ok('Parte B - diagnostico DORA', 'as quatro metricas foram respondidas');
              } else {
                erro('Parte B - diagnostico DORA',
                     'nao encontrei: ' + faltandoB.join(', '));
              }

              // 5d. Paragrafo de fechamento
              const corpo = txtAluno.replace(/<!--[\s\S]*?-->/g, '');
              if (corpo.trim().length >= 900) {
                ok('Analise propria',
                   'o texto tem corpo suficiente para uma analise, nao so respostas soltas');
              } else {
                avisos.push(
                  'O arquivo esta bem curto (' + corpo.trim().length + ' caracteres). ' +
                  'A Parte B pede um paragrafo dizendo **qual metrica era a pior e o ' +
                  'que exatamente causava isso** --- e esse paragrafo que vale a nota ' +
                  'de analise propria, nao os numeros.'
                );
              }
            } else if (fAluno) {
              avisos.push('Nao consegui ler o conteudo de `' + arquivoAluno + '`.');
            }

            // ---------------------------------------------------------------
            // Comentario no PR
            // ---------------------------------------------------------------
            const falhas = obrigatorios.filter(c => !c.passou);
            const marca  = '<!-- autograding:atividade-00 -->';

            // Montado linha a linha, e nao com template literal multilinha:
            // uma linha em coluna 0 quebraria o bloco YAML deste workflow.
            const out = [];
            out.push(marca);
            out.push('### Verificacao automatica --- Atividade 0');
            out.push('');
            out.push('| | Item | Observacao |');
            out.push('|---|---|---|');
            // Um '|' solto no texto quebraria a coluna da tabela
            const celula = s => String(s).replace(/\|/g, '\\|');
            for (const c of obrigatorios) {
              out.push(
                '| ' + (c.passou ? '✅' : '❌') +
                ' | ' + celula(c.nome) + ' | ' + celula(c.detalhe) + ' |'
              );
            }
            out.push('');

            if (avisos.length) {
              out.push('> [!NOTE]');
              for (const a of avisos) out.push('> - ' + a);
              out.push('');
            }

            let corpo = out.join('\n');

            corpo += falhas.length === 0
              ? `\n**Tudo certo por aqui, @${login}.** Nao esqueca da segunda etapa: ` +
                'poste o link deste PR na tarefa da Atividade 0 no campus virtual. ' +
                'O horario daquela postagem e o registro oficial da entrega.\n'
              : `\n**Faltam ${falhas.length} item(ns), @${login}.** Corrija, faca um novo ` +
                'commit e `git push` na mesma branch --- este PR se atualiza sozinho e ' +
                'a verificacao roda de novo. Pode repetir quantas vezes quiser antes do ' +
                'prazo.\n';

            corpo += '\n<sub>Esta verificacao cobre o que a maquina consegue julgar. ' +
              'A nota final considera tambem clareza, justificativa das decisoes e ' +
              'qualidade da analise --- avaliadas pelo professor.</sub>';

            const anteriores = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number: pr.number, per_page: 100 }
            );
            const meu = anteriores.find(c => c.body && c.body.includes(marca));

            if (meu) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: meu.id, body: corpo,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number: pr.number, body: corpo,
              });
            }

            if (falhas.length) {
              core.setFailed(
                `Atividade 0: ${falhas.length} item(ns) pendente(s) --- ` +
                falhas.map(f => f.nome).join('; ')
              );
            }

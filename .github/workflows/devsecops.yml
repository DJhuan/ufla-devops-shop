name: DevSecOps CI/CD Pipeline

on:
  push:
    branches:
      - tp-main
      - tp-dev
  pull_request:
    branches:
      - tp-main

permissions:
  contents: read

env:
  REGISTRY_USER: djhuan
  IMAGE_NAME: ufla-devops-shop

jobs:
  # -------------------------------------------------------------
  # Requisito 1: Gitleaks - Detecção de segredos
  # -------------------------------------------------------------
  gitleaks:
    name: Gitleaks (Secret Detection)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # -------------------------------------------------------------
  # Testes Unitários e Cobertura de Código
  # -------------------------------------------------------------
  test:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Pytest with Coverage
        run: |
          pytest tests/ --cov=app --cov-report=xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # -------------------------------------------------------------
  # Requisito 2: SonarCloud - Análise Estática (SAST) e Quality Gate
  # -------------------------------------------------------------
  sonarcloud:
    name: SonarCloud SAST & Quality Gate
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-report

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      - name: Inspect and check Quality Gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          cat .scannerwork/report-task.txt
          ceTaskUrl=$(sed -n 's/^ceTaskUrl=\(.*\)/\1/p' .scannerwork/report-task.txt)
          echo "Testing curl to $ceTaskUrl..."
          curl -v --user "${SONAR_TOKEN}:" "$ceTaskUrl" || true

      - name: SonarCloud Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  # -------------------------------------------------------------
  # Requisito 3 (Parte 1): Trivy - Análise de dependências do projeto (FS)
  # -------------------------------------------------------------
  trivy-fs:
    name: Trivy (Dependency Scan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Trivy Dependency Scan (Audit LOW & MEDIUM - Non-blocking)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'LOW,MEDIUM'
          exit-code: '0'
          format: 'table'

      - name: Trivy Dependency Scan (Enforce CRITICAL & HIGH with fixes - Blocking)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'
          format: 'table'

  # -------------------------------------------------------------
  # Build Docker, Requisito 3 (Parte 2: Trivy Imagem) e Requisito 4 (Syft: SBOM)
  # -------------------------------------------------------------
  docker-security-sbom:
    name: Docker Build, Trivy Image Scan & Syft SBOM
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (Local test tag)
        run: |
          docker build -t ${{ env.REGISTRY_USER }}/${{ env.IMAGE_NAME }}:${{ github.sha }} .

      - name: Trivy Image Scan (Audit LOW & MEDIUM - Non-blocking)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.REGISTRY_USER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}'
          severity: 'LOW,MEDIUM'
          exit-code: '0'
          format: 'table'

      - name: Trivy Image Scan (Enforce CRITICAL & HIGH with fixes - Blocking)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.REGISTRY_USER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'
          format: 'table'

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          image: '${{ env.REGISTRY_USER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}'
          format: 'spdx-json'
          output-file: 'sbom.spdx.json'

      - name: Publish SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-docker-image
          path: sbom.spdx.json

  # -------------------------------------------------------------
  # Publicação da Imagem no Docker Hub
  # Executa somente em push na branch tp-main após TODOS os checks passarem
  # -------------------------------------------------------------
  publish:
    name: Publish Docker Image
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/tp-main' && github.event_name == 'push'
    needs: [gitleaks, sonarcloud, trivy-fs, docker-security-sbom]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY_USER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY_USER }}/${{ env.IMAGE_NAME }}:${{ github.run_number }}
            ${{ env.REGISTRY_USER }}/${{ env.IMAGE_NAME }}:latest
